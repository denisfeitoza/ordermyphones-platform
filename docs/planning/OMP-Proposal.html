<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMP Platform — Mind Map</title>
<style>
  :root{
    --bg:#08090c; --panel:#12151d; --panel2:#171b24; --border:#262c38; --border2:#333b49;
    --text:#e8ebf1; --muted:#8b93a4;
    --brand:#c46bff; --brand2:#5cc8ff;
    --done:#22c07a; --wire:#2dd4bf; --scaffold:#f2b23c; --todo:#8b93a4; --new:#c46bff; --decision:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:14px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;cursor:grab;background:
     radial-gradient(1400px 800px at 60% 40%, #14101d 0%, #08090c 60%)}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .vein{fill:none;stroke-linecap:round}
  .card rect{transition:filter .12s}
  .card:hover rect{filter:brightness(1.25)}
  .card text{pointer-events:none;dominant-baseline:middle}
  .card .lbl{fill:var(--text)}
  .card.dim{opacity:.42}
  .toggle{fill:#0c0e13;stroke-width:1.4}
  .toggle-sign{fill:var(--muted);pointer-events:none;dominant-baseline:middle;text-anchor:middle;font-weight:700}
  /* HUD */
  .hud{position:fixed;z-index:10;background:rgba(18,21,29,.86);border:1px solid var(--border2);
    border-radius:14px;backdrop-filter:blur(8px)}
  #topbar{top:14px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px}
  h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.01em}
  h1 .a{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .grow{flex:1}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border2);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer}
  .seg button.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#0a0b0e}
  .btn{cursor:pointer;border:1px solid var(--border2);background:var(--panel);color:var(--text);
    border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;user-select:none}
  .btn:hover{background:var(--panel2)} .btn:active{transform:scale(.97)}
  input.search{background:var(--panel);border:1px solid var(--border2);color:var(--text);border-radius:999px;
    padding:7px 13px;font-size:12.5px;outline:none;width:190px}
  input.search:focus{border-color:var(--brand)}
  #legend{bottom:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:70vw;padding:9px 12px}
  .lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;user-select:none}
  .lg.off{opacity:.3} .lg .d{width:9px;height:9px;border-radius:50%}
  .cxmini{display:inline-flex;align-items:flex-end;gap:1.5px;height:13px}
  .cxmini i{width:2.5px;border-radius:1px;background:var(--muted);display:block}
  #zoom{bottom:14px;right:14px;display:flex;flex-direction:column;gap:6px;padding:8px}
  #zoom button{width:34px;height:34px;font-size:17px;font-weight:800;border-radius:10px;border:1px solid var(--border2);
    background:var(--panel);color:var(--text);cursor:pointer}
  #zoom button:hover{background:var(--panel2)}
  #hint{bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);padding:6px 12px;pointer-events:none}
  #detail{top:86px;right:14px;width:330px;max-width:calc(100vw - 28px);max-height:calc(100vh - 170px);overflow:auto;
    padding:16px 16px 18px;display:none;box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
  #detail.on{display:block}
  #detail .crumb{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  #detail .crumb b{color:var(--brand2);font-weight:600}
  #detail h2{font-size:16px;margin:0 0 10px;line-height:1.35;letter-spacing:-.01em}
  #detail .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  #detail .pill{font-size:10px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
  #detail .size{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:#1c2230;color:var(--muted);border:1px solid var(--border2)}
  #detail .cxchip{display:inline-flex;align-items:flex-end;gap:6px;font-size:11px;font-weight:700;color:var(--text);
    padding:3px 9px;border-radius:999px;background:#1c2230;border:1px solid var(--border2)}
  #detail .cxbars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
  #detail .cxbars i{width:3px;border-radius:1px;display:block}
  #detail .mean{font-size:12px;color:var(--muted);margin:2px 0 14px}
  #detail .kh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 8px;font-weight:700}
  #detail .kid{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;border-top:1px solid var(--border)}
  #detail .kid .kd{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px}
  #detail .close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;border:1px solid var(--border2);
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .p-done{background:rgba(34,192,122,.16);color:var(--done)} .p-wire{background:rgba(45,212,191,.16);color:var(--wire)}
  .p-scaffold{background:rgba(242,178,60,.16);color:var(--scaffold)} .p-todo{background:rgba(139,147,164,.16);color:#aeb6c6}
  .p-new{background:rgba(196,107,255,.18);color:var(--new)} .p-decision{background:rgba(255,93,108,.16);color:var(--decision)}
  /* ---- Outline / proposal view ---- */
  #outline{position:fixed;inset:0;overflow-y:auto;display:none;padding:92px 0 70px}
  #outline.on{display:block}
  .doc{max-width:940px;margin:0 auto;padding:0 20px}
  .cover{padding:18px 4px 6px}
  .cover .ctitle{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .cover .ctitle b{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cover .csub{color:var(--muted);font-size:14px;margin-top:6px;max-width:70ch}
  .cstats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 6px}
  .cstat{background:var(--panel);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;min-width:120px}
  .cstat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
  .cstat span{font-size:12px;color:var(--muted)}
  .cstat.oos{border-color:rgba(255,93,108,.5)} .cstat.oos b{color:var(--decision)}
  .cstat.good b{color:var(--done)}
  .sec{margin:14px 0;border:1px solid var(--border);border-radius:18px;background:var(--panel);overflow:hidden}
  .sechead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-left:4px solid var(--border2);cursor:pointer;transition:background .12s}
  .sechead:hover{background:var(--panel2)}
  .secname{font-size:16px;font-weight:800;flex:1;letter-spacing:-.01em}
  .seccount{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);border-radius:999px;padding:3px 10px}
  .secbody{padding:6px 12px 12px}
  .sec.closed .secbody{display:none}
  .caret{color:var(--muted);transition:transform .15s;font-size:12px;width:12px}
  .sec.closed .caret{transform:rotate(-90deg)}
  .mod{border-radius:12px;margin:4px 0;background:var(--bg2,#0f1116);border:1px solid transparent}
  .mod:hover{border-color:var(--border)}
  .mod.oos{background:rgba(255,93,108,.05);border-color:rgba(255,93,108,.28)}
  .modhead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
  .mdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .mname{flex:1;font-size:14px;font-weight:600}
  .mname .mid{color:var(--brand2);font-family:ui-monospace,monospace;font-size:12.5px;margin-right:4px}
  .szc{font-size:10px;font-weight:800;color:var(--muted);background:var(--panel2);border:1px solid var(--border2);border-radius:6px;padding:2px 6px}
  .obars{display:inline-flex;align-items:flex-end;gap:2px;height:13px}
  .obars i{width:3px;border-radius:1px;display:block}
  .items{padding:0 14px 12px 34px;display:none}
  .mod.open .items{display:block}
  .item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:13px;border-top:1px solid var(--border)}
  .item:first-child{border-top:0}
  .idot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 7px}
  .itxt{flex:1;color:#c9cfda}
  .isz{font-size:10px;font-weight:800;color:var(--muted)}
  .pill{font-size:10px;font-weight:800;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
  .hidden{display:none!important}
  @media(max-width:640px){ input.search{width:120px} #legend{max-width:58vw} h1{font-size:13px} #hint{display:none}
    .cover .ctitle{font-size:20px} #outline{padding-top:120px} }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg"><g id="vp">
    <g id="veins"></g><g id="nodes"></g>
  </g></svg>
</div>

<div class="hud" id="topbar">
  <h1><span class="a" id="ttl"></span></h1>
  <div class="seg" id="viewseg"><button id="v-map" class="on" onclick="setView('map')"></button><button id="v-list" onclick="setView('list')"></button></div>
  <div class="grow"></div>
  <input class="search" id="q" oninput="search()" >
  <div class="seg"><button id="l-en" class="on" onclick="setLang('en')">EN</button><button id="l-pt" onclick="setLang('pt')">PT-BR</button></div>
  <button class="btn" id="b-exp" onclick="allExpand(true)"></button>
  <button class="btn" id="b-col" onclick="allExpand(false)"></button>
  <button class="btn" id="b-fit" onclick="fit()"></button>
</div>
<div id="outline"></div>
<div class="hud" id="legend"></div>
<div class="hud" id="zoom">
  <button onclick="zoomBtn(1.25)">+</button>
  <button onclick="zoomBtn(0.8)">−</button>
</div>
<div class="hud" id="hint"></div>
<div class="hud" id="detail">
  <button class="close" onclick="closeDetail()">×</button>
  <div class="crumb" id="d-crumb"></div>
  <h2 id="d-title"></h2>
  <div class="meta" id="d-meta"></div>
  <div class="mean" id="d-mean"></div>
  <div id="d-kids"></div>
</div>

function renderOutline(){ const o=document.getElementById('outline'); const S=statCounts();
  const sub = CLIENT? I18N[LANG].psub_client : I18N[LANG].psub;
  let h=`<div class="doc"><div class="cover"><div class="ctitle">${I18N[LANG].ptitle}</div><div class="csub">${sub}</div>`;
  if(!CLIENT){ h+=`<div class="cstats"><div class="cstat"><b>${S.mods}</b><span>${I18N[LANG].s_mods}</span></div>`
    +`<div class="cstat good"><b>${S.inScope}</b><span>${I18N[LANG].s_in}</span></div>`
    +`<div class="cstat oos"><b>${S.newCO}</b><span>${I18N[LANG].s_new}</span></div></div>`; }
  h+=`</div>`;
  for(const sec of DATA.children){ if(sec._skip) continue; const mods=sec.children||[];
    h+=`<div class="sec"><div class="sechead" style="border-left-color:${sec._hue}"><span class="caret">▾</span><span class="secname">${escH(label(sec))}</span>${CLIENT?'':`<span class="seccount">${mods.length}</span>`}${barsHTML(cplx(sec))}</div><div class="secbody">`;
    for(const m of mods) h+=modRow(m);
    h+=`</div></div>`; }
  h+=`</div>`; o.innerHTML=h; }
function filterOutline(q){ document.querySelectorAll('#outline .mod').forEach(m=>{ const on=!q||m.textContent.toLowerCase().includes(q); m.classList.toggle('hidden',!on); if(q&&on)m.classList.add('open'); });
  document.querySelectorAll('#outline .sec').forEach(s=>{ const any=[...s.querySelectorAll('.mod')].some(m=>!m.classList.contains('hidden')); s.classList.toggle('hidden',!!q&&!any); if(q)s.classList.remove('closed'); }); }
function setView(v){ VIEW=v;
  document.getElementById('stage').style.display=v==='map'?'block':'none';
  document.getElementById('outline').classList.toggle('on',v==='list');
  document.getElementById('zoom').style.display=v==='map'?'flex':'none';
  document.getElementById('legend').style.display=v==='map'?'flex':'none';
  document.getElementById('hint').style.display=v==='map'?'block':'none';
  document.getElementById('b-fit').style.display=v==='map'?'inline-flex':'none';
  document.getElementById('v-map').classList.toggle('on',v==='map');
  document.getElementById('v-list').classList.toggle('on',v==='list');
  if(v==='list'){ closeDetail(); renderOutline(); } }
document.getElementById('outline').addEventListener('click',e=>{
  const sh=e.target.closest('.sechead'); if(sh){ sh.parentElement.classList.toggle('closed'); return; }
  const mh=e.target.closest('.modhead'); if(mh){ mh.parentElement.classList.toggle('open'); } });

// root gradient def
const defs=document.createElementNS(SVGNS,'defs');
defs.innerHTML='<linearGradient id="rootg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c46bff"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>';
svg.insertBefore(defs, svg.firstChild);

texts(); renderLegend(); draw(); fit();
</script>
