<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMP Platform — Mind Map</title>
<style>
  :root{
    --bg:#08090c; --panel:#12151d; --panel2:#171b24; --border:#262c38; --border2:#333b49;
    --text:#e8ebf1; --muted:#8b93a4;
    --brand:#c46bff; --brand2:#5cc8ff;
    --done:#22c07a; --wire:#2dd4bf; --scaffold:#f2b23c; --todo:#8b93a4; --new:#c46bff; --decision:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font:14px/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;cursor:grab;background:
     radial-gradient(1400px 800px at 60% 40%, #14101d 0%, #08090c 60%)}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .vein{fill:none;stroke-linecap:round}
  .card rect{transition:filter .12s}
  .card:hover rect{filter:brightness(1.25)}
  .card text{pointer-events:none;dominant-baseline:middle}
  .card .lbl{fill:var(--text)}
  .card.dim{opacity:.42}
  .toggle{fill:#0c0e13;stroke-width:1.4}
  .toggle-sign{fill:var(--muted);pointer-events:none;dominant-baseline:middle;text-anchor:middle;font-weight:700}
  /* HUD */
  .hud{position:fixed;z-index:10;background:rgba(18,21,29,.86);border:1px solid var(--border2);
    border-radius:14px;backdrop-filter:blur(8px)}
  #topbar{top:14px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px}
  h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.01em}
  h1 .a{background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .grow{flex:1}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border2);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer}
  .seg button.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#0a0b0e}
  .btn{cursor:pointer;border:1px solid var(--border2);background:var(--panel);color:var(--text);
    border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;user-select:none}
  .btn:hover{background:var(--panel2)} .btn:active{transform:scale(.97)}
  input.search{background:var(--panel);border:1px solid var(--border2);color:var(--text);border-radius:999px;
    padding:7px 13px;font-size:12.5px;outline:none;width:190px}
  input.search:focus{border-color:var(--brand)}
  #legend{bottom:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:70vw;padding:9px 12px}
  .lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);background:var(--panel);
    border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;user-select:none}
  .lg.off{opacity:.3} .lg .d{width:9px;height:9px;border-radius:50%}
  #zoom{bottom:14px;right:14px;display:flex;flex-direction:column;gap:6px;padding:8px}
  #zoom button{width:34px;height:34px;font-size:17px;font-weight:800;border-radius:10px;border:1px solid var(--border2);
    background:var(--panel);color:var(--text);cursor:pointer}
  #zoom button:hover{background:var(--panel2)}
  #hint{bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);padding:6px 12px;pointer-events:none}
  #detail{top:86px;right:14px;width:330px;max-width:calc(100vw - 28px);max-height:calc(100vh - 170px);overflow:auto;
    padding:16px 16px 18px;display:none;box-shadow:0 20px 60px -20px rgba(0,0,0,.7)}
  #detail.on{display:block}
  #detail .crumb{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  #detail .crumb b{color:var(--brand2);font-weight:600}
  #detail h2{font-size:16px;margin:0 0 10px;line-height:1.35;letter-spacing:-.01em}
  #detail .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  #detail .pill{font-size:10px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:uppercase}
  #detail .size{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:#1c2230;color:var(--muted);border:1px solid var(--border2)}
  #detail .mean{font-size:12px;color:var(--muted);margin:2px 0 14px}
  #detail .kh{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 8px;font-weight:700}
  #detail .kid{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;border-top:1px solid var(--border)}
  #detail .kid .kd{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 8px}
  #detail .close{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;border:1px solid var(--border2);
    background:var(--panel);color:var(--muted);cursor:pointer;font-size:15px;line-height:1}
  .p-done{background:rgba(34,192,122,.16);color:var(--done)} .p-wire{background:rgba(45,212,191,.16);color:var(--wire)}
  .p-scaffold{background:rgba(242,178,60,.16);color:var(--scaffold)} .p-todo{background:rgba(139,147,164,.16);color:#aeb6c6}
  .p-new{background:rgba(196,107,255,.18);color:var(--new)} .p-decision{background:rgba(255,93,108,.16);color:var(--decision)}
  @media(max-width:640px){ input.search{width:120px} #legend{max-width:58vw} h1{font-size:13px} #hint{display:none} }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg"><g id="vp">
    <g id="veins"></g><g id="nodes"></g>
  </g></svg>
</div>

<div class="hud" id="topbar">
  <h1><span class="a" id="ttl"></span></h1>
  <div class="grow"></div>
  <input class="search" id="q" oninput="search()" >
  <div class="seg"><button id="l-en" class="on" onclick="setLang('en')">EN</button><button id="l-pt" onclick="setLang('pt')">PT-BR</button></div>
  <button class="btn" id="b-exp" onclick="allExpand(true)"></button>
  <button class="btn" id="b-col" onclick="allExpand(false)"></button>
  <button class="btn" id="b-fit" onclick="fit()"></button>
</div>
<div class="hud" id="legend"></div>
<div class="hud" id="zoom">
  <button onclick="zoomBtn(1.25)">+</button>
  <button onclick="zoomBtn(0.8)">−</button>
</div>
<div class="hud" id="hint"></div>
<div class="hud" id="detail">
  <button class="close" onclick="closeDetail()">×</button>
  <div class="crumb" id="d-crumb"></div>
  <h2 id="d-title"></h2>
  <div class="meta" id="d-meta"></div>
  <div class="mean" id="d-mean"></div>
  <div id="d-kids"></div>
</div>

function disp(n){ const s=label(n); return s.length>LMAX ? s.slice(0,LMAX-1)+'…' : s; }
function cardW(n){ const base = n._depth===0?18:0; return disp(n).length*CW + PAD*2 + base + (n.status?14:0) + (n.size?18:0); }

function visKids(n){ return (n._collapsed||!n.children)?[]:n.children; }
function leaves(n){ const k=visKids(n); if(!k.length) return 1; return k.reduce((s,c)=>s+leaves(c),0); }

const cx=0, cy=0;
function layout(n,depth,a0,a1){
  n._depth=depth;
  const a=(a0+a1)/2; n._ang=a;
  const r = RING.slice(0,depth+1).reduce((s,x)=>s+x,0);
  n._r=r; n._x=cx+r*Math.cos(a); n._y=cy+r*Math.sin(a);
  const k=visKids(n); if(!k.length) return;
  const tot=k.reduce((s,c)=>s+leaves(c),0);
  let cur=a0;
  for(const c of k){ const span=(a1-a0)*leaves(c)/tot; layout(c,depth+1,cur,cur+span); cur+=span; }
}
function relayout(){
  // root children span full circle; give a small gap
  const k=visKids(DATA); const tot=k.reduce((s,c)=>s+leaves(c),0)||1;
  DATA._depth=0; DATA._ang=0; DATA._r=0; DATA._x=0; DATA._y=0;
  let cur=-Math.PI/2; // start at top
  for(const c of k){ const span=2*Math.PI*leaves(c)/tot; layout(c,1,cur,cur+span); cur+=span; }
}

function polar(r,a){ return [r*Math.cos(a), r*Math.sin(a)]; }
function vein(p,c){
  const [x1,y1]=[p._x,p._y], [x2,y2]=[c._x,c._y];
  const r1=p._r + RING[Math.min(c._depth,3)]*0.5;
  const r2=c._r - RING[Math.min(c._depth,3)]*0.5;
  const [cx1,cy1]=polar(r1,p._ang), [cx2,cy2]=polar(r2,c._ang);
  return `M${x1.toFixed(1)} ${y1.toFixed(1)} C${cx1.toFixed(1)} ${cy1.toFixed(1)} ${cx2.toFixed(1)} ${cy2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}

const gV=document.getElementById('veins'), gN=document.getElementById('nodes');
function passesFilter(n){ // keep if self or descendant has an active status; structural info leaves always kept
  const anyKid=(n.children||[]).some(passesFilter);
  if(n.status) return active.has(n.status)||anyKid;
  if(!n.children||!n.children.length) return true;
  return anyKid;
}

function draw(){
  relayout();
  gV.innerHTML=''; gN.innerHTML='';
  (function walk(n){
    const kids=visKids(n);
    for(const c of kids){
      if(!passesFilter(c)) continue;
      const path=document.createElementNS(SVGNS,'path');
      path.setAttribute('class','vein'); path.setAttribute('d',vein(n,c));
      path.setAttribute('stroke', c._hue);
      path.setAttribute('stroke-width', Math.max(1, 3.4 - c._depth*0.7));
      path.setAttribute('opacity', 0.5 - c._depth*0.06);
      gV.appendChild(path);
      walk(c);
    }
  })(DATA);
  // nodes (draw after veins)
  (function walk(n){
    if(n!==DATA && !passesFilter(n)) return;
    drawNode(n);
    for(const c of visKids(n)){ if(passesFilter(c)) walk(c); }
  })(DATA);
}

function drawNode(n){
  const isRoot=n._depth===0, isSection=n._depth===1, isModule=/^M\d\d/.test(n.en)||/^D\d/.test(n.en);
  const left = Math.cos(n._ang)<-0.0001 && !isRoot;
  const w=isRoot? label(n).length*CW+40 : cardW(n);
  const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','card'+(n.status&&!active.has(n.status)?' dim':''));
  const x = isRoot? -w/2 : (left? n._x - w : n._x);
  const y = n._y - H/2;
  const rect=document.createElementNS(SVGNS,'rect');
  rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',w); rect.setAttribute('height',H);
  rect.setAttribute('rx',isRoot?13:9);
  if(isRoot){ rect.setAttribute('fill','url(#rootg)'); rect.setAttribute('stroke','none'); }
  else{ rect.setAttribute('fill', isSection? '#1a2030' : '#141822');
        rect.setAttribute('stroke', n.status? `var(--${n.status})` : (isSection? n._hue : '#2a3140'));
        rect.setAttribute('stroke-width', isSection?1.6:1.1);
        rect.setAttribute('stroke-opacity', n.status?0.8:(isSection?0.9:0.7)); }
  g.appendChild(rect);
  // status dot
  let tx = x + PAD;
  if(n.status){ const d=document.createElementNS(SVGNS,'circle'); d.setAttribute('cx',x+10);d.setAttribute('cy',n._y);
    d.setAttribute('r',3.5); d.setAttribute('fill',`var(--${n.status})`); g.appendChild(d); tx=x+20; }
  const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','lbl');
  t.setAttribute('x',tx); t.setAttribute('y',n._y+0.5);
  t.setAttribute('font-size', isRoot?15:(isSection?13.5:12));
  t.setAttribute('font-weight', isRoot?800:(isSection||isModule?700:500));
  if(isRoot){ t.setAttribute('fill','#0a0b0e'); t.setAttribute('text-anchor','middle'); t.setAttribute('x', n._x); }
  t.textContent=isRoot?label(n):disp(n);
  g.appendChild(t);
  const ttl=document.createElementNS(SVGNS,'title'); ttl.textContent=label(n); g.appendChild(ttl);
  // size badge on the right
  if(n.size){ const b=document.createElementNS(SVGNS,'text'); b.setAttribute('x',x+w-9);b.setAttribute('y',n._y+0.5);
    b.setAttribute('text-anchor','end'); b.setAttribute('font-size',10);b.setAttribute('font-weight',800);
    b.setAttribute('fill','var(--muted)'); b.textContent=n.size; g.appendChild(b); }
  // collapse indicator if it has hidden/holdable children
  if(n.children&&n.children.length){
    const cxp = left? x-2 : x+w+2, cyp=n._y;
    const tg=document.createElementNS(SVGNS,'circle'); tg.setAttribute('class','toggle');
    tg.setAttribute('cx',cxp);tg.setAttribute('cy',cyp);tg.setAttribute('r',9);
    tg.setAttribute('stroke', n._hue);
    const sg=document.createElementNS(SVGNS,'text'); sg.setAttribute('class','toggle-sign');
    sg.setAttribute('x',cxp);sg.setAttribute('y',cyp+0.5);sg.setAttribute('font-size',13);
    sg.textContent=n._collapsed?'+':'–';
    const toggle=(e)=>{ e.stopPropagation(); n._collapsed=!n._collapsed; draw(); };
    tg.style.cursor='pointer'; sg.style.cursor='pointer'; tg.onclick=toggle; sg.onclick=toggle;
    g.appendChild(tg); g.appendChild(sg);
  }
  g.style.cursor='pointer';
  g.onclick=(e)=>{ e.stopPropagation(); openDetail(n); };
  gN.appendChild(g);
}

// ---- pan / zoom ----
let vp={x:0,y:0,s:1};
const vpEl=document.getElementById('vp'), svg=document.getElementById('svg'), stage=document.getElementById('stage');
function apply(){ vpEl.setAttribute('transform',`translate(${vp.x} ${vp.y}) scale(${vp.s})`); }
function fit(){ const b=vpEl.getBBox(); const W=innerWidth,Hh=innerHeight;
  const s=Math.min(W/(b.width+180), Hh/(b.height+220), 1.0);
  vp.s=s; vp.x=W/2 - (b.x+b.width/2)*s; vp.y=Hh/2 - (b.y+b.height/2)*s; apply(); }
function zoomBtn(f){ zoomAt(innerWidth/2, innerHeight/2, f); }
function zoomAt(px,py,f){ const ns=Math.max(0.2,Math.min(3,vp.s*f));
  vp.x = px-(px-vp.x)*(ns/vp.s); vp.y=py-(py-vp.y)*(ns/vp.s); vp.s=ns; apply(); }
stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.12:0.89); },{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest && e.target.closest('.card')) return; drag={x:e.clientX,y:e.clientY,ox:vp.x,oy:vp.y}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',e=>{ if(!drag)return; vp.x=drag.ox+(e.clientX-drag.x); vp.y=drag.oy+(e.clientY-drag.y); apply(); });
stage.addEventListener('pointerup',e=>{ drag=null; stage.classList.remove('drag'); });
// pinch
let pt=new Map();
stage.addEventListener('pointerdown',e=>pt.set(e.pointerId,e));
stage.addEventListener('pointermove',e=>{ if(pt.has(e.pointerId))pt.set(e.pointerId,e);
  if(pt.size===2){ drag=null; const [a,b]=[...pt.values()]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(stage._pd){ const f=d/stage._pd; zoomAt((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,f); } stage._pd=d; } });
stage.addEventListener('pointerup',e=>{ pt.delete(e.pointerId); if(pt.size<2)stage._pd=null; });

// ---- controls ----
function allExpand(open){ (function w(n){ if(n._depth>=1 && n.children&&n.children.length) n._collapsed=!open; (n.children||[]).forEach(w); })(DATA); draw(); fit(); }
function search(){ const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ draw(); return; }
  // expand branches containing a hit, dim the rest
  (function w(n){ const hit=(n.en+' '+n.pt).toLowerCase().includes(q);
     let kidhit=false; (n.children||[]).forEach(c=>{ if(w(c))kidhit=true; });
     if(kidhit && n.children) n._collapsed=false;
     n._hit = hit||kidhit; return n._hit; })(DATA);
  draw();
  // dim non-hits
  document.querySelectorAll('#nodes .card').forEach(()=>{});
  gN.querySelectorAll('text.lbl').forEach(t=>{ const on=t.textContent.toLowerCase().includes(q);
    t.closest('.card').classList.toggle('dim', !on && q.length>0); });
}
function renderLegend(){ const box=document.getElementById('legend'); box.innerHTML='';
  const c={}; STATUS.forEach(s=>c[s]=0); (function w(n){ if(n.status&&c[n.status]!==undefined)c[n.status]++; (n.children||[]).forEach(w); })(DATA);
  STATUS.forEach(s=>{ const el=document.createElement('span'); el.className='lg'+(active.has(s)?'':' off');
    el.innerHTML=`<span class="d" style="background:var(--${s})"></span>${STLABEL[LANG][s]} ${c[s]}`;
    el.onclick=()=>{ active.has(s)?active.delete(s):active.add(s); el.classList.toggle('off'); draw(); };
    box.appendChild(el); }); }
function texts(){ document.getElementById('ttl').textContent=I18N[LANG].ttl;
  document.getElementById('q').placeholder=I18N[LANG].q;
  document.getElementById('b-exp').textContent=I18N[LANG].exp;
  document.getElementById('b-col').textContent=I18N[LANG].col;
  document.getElementById('b-fit').textContent=I18N[LANG].fit;
  document.getElementById('hint').textContent=I18N[LANG].hint; }
function setLang(l){ LANG=l; document.getElementById('l-en').classList.toggle('on',l==='en');
  document.getElementById('l-pt').classList.toggle('on',l==='pt'); texts(); renderLegend(); draw();
  if(curDetail) openDetail(curDetail); }

// ---- detail panel ----
function pathOf(n){ const arr=[]; let p=n._parent; while(p&&p._depth>=1){ arr.unshift(label(p)); p=p._parent; } return arr; }
let curDetail=null;
function openDetail(n){
  if(n._depth===0){ closeDetail(); return; }
  curDetail=n;
  document.getElementById('d-crumb').innerHTML = pathOf(n).map(x=>`<b>${x}</b>`).join(' <span style="opacity:.5">›</span> ') || '&nbsp;';
  document.getElementById('d-title').textContent = label(n);
  const meta=document.getElementById('d-meta'); meta.innerHTML='';
  if(n.status){ const p=document.createElement('span'); p.className='pill p-'+n.status; p.textContent=STLABEL[LANG][n.status]; meta.appendChild(p); }
  if(n.size){ const s=document.createElement('span'); s.className='size'; s.textContent=n.size; meta.appendChild(s); }
  document.getElementById('d-mean').textContent =
     (n.status?STMEAN[LANG][n.status]:'') + (n.size?`  ·  ${n.size} = ${SIZEMEAN[LANG]}`:'');
  const kb=document.getElementById('d-kids'); kb.innerHTML='';
  const kids=n.children||[];
  if(kids.length){
    const h=document.createElement('div'); h.className='kh';
    h.textContent=(LANG==='pt'?'Itens':'Items')+` (${kids.length})`; kb.appendChild(h);
    kids.forEach(c=>{ const row=document.createElement('div'); row.className='kid';
      const d=document.createElement('span'); d.className='kd'; d.style.background=c.status?`var(--${c.status})`:'#39424f'; row.appendChild(d);
      const tx=document.createElement('span'); tx.textContent=label(c)+(c.size?`  (${c.size})`:''); row.appendChild(tx);
      kb.appendChild(row); });
  }
  document.getElementById('detail').classList.add('on');
}
function closeDetail(){ document.getElementById('detail').classList.remove('on'); curDetail=null; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeDetail(); });

// root gradient def
const defs=document.createElementNS(SVGNS,'defs');
defs.innerHTML='<linearGradient id="rootg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c46bff"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>';
svg.insertBefore(defs, svg.firstChild);

texts(); renderLegend(); draw(); fit();
</script>
</body>
